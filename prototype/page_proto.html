<!doctype html>
<!-- PROTOTYPE (throwaway): benefit tracker page. Served by prototype/app_proto.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerkWatch · Benefits (prototype)</title>
<style>
  :root {
    --bg: #07161a; --panel: #0c2026; --tile: #0f262d; --line: #1b3a42; --text: #e4efe9; --muted: #86a39b;
    --green: #4ed59a; --yellow: #d8b23c; --red: #ef6b6b; --blue: #5aa9e6; --grey: #4a6169;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font: 600 30px/1.1 Georgia, serif; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 18px; }
  .proto { font-size: 11px; color: var(--yellow); border: 1px solid var(--yellow); border-radius: 10px; padding: 1px 7px; margin-left: 8px; vertical-align: middle; }
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.risk b { color: var(--red); } .stat.missed b { color: var(--yellow); } .stat.captured b { color: var(--green); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .chip { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 16px; padding: 5px 12px; cursor: pointer; font: inherit; }
  .chip.on { border-color: var(--green); color: var(--green); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 18px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .card-head h2 { font-size: 17px; margin: 0; }
  .section { padding: 10px 14px 4px; }
  .section-title { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin: 4px 2px 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .tile { background: var(--tile); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; cursor: pointer; }
  .tile:hover { border-color: #2d5a64; }
  .tile.at_risk { border-color: rgba(239,107,107,.55); }
  .tile-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .tile-title { font-weight: 600; }
  .badge { font-size: 11px; border-radius: 8px; padding: 1px 7px; white-space: nowrap; }
  .badge.at_risk { background: rgba(239,107,107,.15); color: var(--red); }
  .badge.manual { color: var(--muted); border: 1px solid var(--line); }
  .tile-bottom { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .dots { display: flex; gap: 3px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--grey); display: inline-flex; align-items: center; justify-content: center; font-size: 8px; color: var(--muted); }
  .dot.used { background: var(--green); border-color: var(--green); color: #05301f; }
  .dot.partial { background: rgba(216,178,60,.35); border-color: var(--yellow); }
  .dot.missed { border-color: var(--grey); color: var(--grey); }
  .dot.pending { border-style: dashed; }
  .dot.unmarked { border-color: var(--grey); }
  .dot.at_risk { border-color: var(--red); box-shadow: 0 0 0 2px rgba(239,107,107,.25); }
  .dot.open { border-color: var(--blue); }
  .bar { flex: 1; height: 5px; background: #16323a; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .amt { font-weight: 600; white-space: nowrap; }
  .amt.full { color: var(--green); }
  .days { color: var(--muted); font-size: 12px; white-space: nowrap; }
  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 22px 22px 40px; transform: translateX(100%); transition: transform .2s; }
  .open .scrim { display: block; } .open .drawer { transform: none; }
  .close { float: right; background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
  .box { background: var(--tile); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; margin-top: 12px; }
  .box h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .months { display: flex; justify-content: space-between; gap: 4px; margin: 10px 0 12px; }
  .month { text-align: center; font-size: 11px; color: var(--muted); }
  .month .dot { width: 22px; height: 22px; font-size: 11px; margin-bottom: 3px; }
  .month.clickable { cursor: pointer; }
  .risk-note { color: var(--red); font-weight: 600; }
  .tip { margin: 8px 0; } .tip a { color: var(--blue); font-size: 12px; }
  .meta { color: var(--muted); font-size: 12px; }
  details summary { cursor: pointer; color: var(--muted); }
  .terms { white-space: pre-wrap; font-size: 13px; color: #c5d6cf; margin-top: 8px; }
  .chat-log { max-height: 380px; overflow-y: auto; }
  .msg { margin: 8px 0; padding: 9px 11px; border-radius: 9px; }
  .msg.user { background: #16323a; margin-left: 40px; }
  .msg.assistant { background: #0a1b20; border: 1px solid var(--line); }
  .msg ul { margin: 6px 0; padding-left: 18px; } .msg a { color: var(--blue); }
  .trace { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .warn { font-size: 12px; color: var(--yellow); margin-top: 6px; }
  .chat-form { display: flex; gap: 8px; margin-top: 8px; }
  .chat-form input { flex: 1; background: #0a1b20; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 10px; font: inherit; }
  .btn { background: var(--green); color: #05301f; border: 0; border-radius: 8px; padding: 8px 13px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: none; color: var(--green); border: 1px solid var(--green); }
  .suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .suggest button { font-size: 12px; }
  .legend { color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; margin: -6px 0 16px; }
  .legend .dot { vertical-align: -2px; margin-right: 4px; }
</style>
</head>
<body>
<main>
  <h1>Benefits <span class="proto">PROTOTYPE</span></h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="strip" id="strip"></div>
  <div class="legend">
    <span><i class="dot used">✓</i>used</span><span><i class="dot partial"></i>partial</span>
    <span><i class="dot missed">✕</i>missed</span><span><i class="dot at_risk"></i>at risk</span>
    <span><i class="dot open"></i>open</span><span><i class="dot unmarked">?</i>manual, not marked</span>
    <span><i class="dot pending"></i>waiting for statement</span>
  </div>
  <div class="toolbar" id="toolbar"></div>
  <div id="cards"></div>
</main>
<div id="shell">
  <div class="scrim" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer"></aside>
</div>
<script>
const $ = (s) => document.querySelector(s);
const money = (m) => "$" + (m / 100).toLocaleString(undefined, {minimumFractionDigits: m % 100 ? 2 : 0, maximumFractionDigits: 2});
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ORDER = ["monthly", "quarterly", "semiannual", "annual"];
const GROUP = {monthly: "Monthly", quarterly: "Quarterly", semiannual: "Semi-annual", annual: "Annual"};
const GLYPH = {used: "✓", missed: "✕", unmarked: "?"};
let data = null, filter = "all", openId = null;
const chats = {};

async function load() {
  data = await (await fetch("/api/tracker")).json();
  render();
  if (openId) renderDrawer(openId);
}

function render() {
  const t = data.totals;
  const through = Object.values(data.data_through).filter(Boolean).sort()[0];
  $("#sub").textContent = `${data.benefits.length} tracked credits · as of ${data.as_of} · statements through ${through}`;
  $("#strip").innerHTML = `
    <div class="stat risk"><b>${money(t.at_risk_minor)}</b><span>at risk now (expiring soon)</span></div>
    <div class="stat missed"><b>${money(t.missed_minor)}</b><span>missed this year</span></div>
    <div class="stat captured"><b>${money(t.captured_minor)}</b><span>captured this year</span></div>`;
  const filters = {all: "All", at_risk: "At risk", missed: "Missed something", manual: "Manually tracked"};
  $("#toolbar").innerHTML = Object.entries(filters).map(([k, v]) =>
    `<button class="chip ${filter === k ? "on" : ""}" onclick="filter='${k}';render()">${v}</button>`).join("");
  const keep = (b) => filter === "all" || (filter === "at_risk" && b.current.status === "at_risk")
    || (filter === "missed" && b.ytd.missed_minor > 0) || (filter === "manual" && b.tracking === "manual");
  const cards = {};
  for (const b of data.benefits.filter(keep)) (cards[b.card] ??= []).push(b);
  $("#cards").innerHTML = Object.entries(cards).map(([card, list]) => {
    const left = list.reduce((s, b) => s + b.current.remaining_minor, 0);
    const sections = ORDER.map((period) => {
      const items = list.filter((b) => b.period === period)
        .sort((a, b) => (b.current.status === "at_risk") - (a.current.status === "at_risk"));
      if (!items.length) return "";
      return `<div class="section"><div class="section-title"><span>${GROUP[period]}</span>
        <span>Resets in ${items[0].current.days_left} days</span></div>
        <div class="grid">${items.map(tile).join("")}</div></div>`;
    }).join("");
    return `<div class="card"><div class="card-head"><h2>${esc(card)}</h2>
      <span class="meta">${money(left)} left this period</span></div>${sections}</div>`;
  }).join("") || `<p class="meta">Nothing matches this filter.</p>`;
}

function dots(b) {
  return b.periods.map((p) => `<i class="dot ${p.status}" title="${p.label}: ${p.status} ${money(p.used_minor)} / ${money(p.amount_minor)}">${GLYPH[p.status] ?? ""}</i>`).join("");
}

function tile(b) {
  const c = b.current, pct = Math.round(100 * c.used_minor / c.amount_minor);
  const badge = c.status === "at_risk" ? `<span class="badge at_risk">${c.days_left}d left · ${money(c.remaining_minor)} unused</span>`
    : b.tracking === "manual" ? `<span class="badge manual">manual</span>` : "";
  const showDots = b.periods.length > 1;
  return `<div class="tile ${c.status}" onclick="openDrawer('${b.benefit_id}')">
    <div class="tile-top"><span class="tile-title">${esc(b.title)}</span>${badge}</div>
    <div class="tile-bottom">${showDots ? `<span class="dots">${dots(b)}</span>` : ""}
      <span class="bar"><i style="width:${pct}%"></i></span>
      <span class="amt ${pct >= 100 ? "full" : ""}">${money(c.used_minor)} / ${money(c.amount_minor)}</span>
      ${showDots ? "" : `<span class="days">${c.days_left}d</span>`}</div></div>`;
}

function openDrawer(id) { openId = id; $("#shell").classList.add("open"); renderDrawer(id); }
function closeDrawer() { openId = null; $("#shell").classList.remove("open"); }

function renderDrawer(id) {
  const b = data.benefits.find((x) => x.benefit_id === id), c = b.current;
  const months = b.periods.map((p) => `<div class="month ${b.tracking === "manual" ? "clickable" : ""}"
      ${b.tracking === "manual" ? `onclick="toggleMark('${id}','${p.start}')" title="Click to mark used / unmark"` : ""}>
      <i class="dot ${p.status}">${GLYPH[p.status] ?? ""}</i><br>${p.label}</div>`).join("");
  const credits = b.periods.flatMap((p) => p.credits).map((x) => `<div>${x.date} · ${money(x.amount_minor)} statement credit</div>`).join("")
    || `<div class="meta">No matching statement credits this year.</div>`;
  const note = c.status === "at_risk" ? `<span class="risk-note">${c.days_left} days left · ${money(c.remaining_minor)} will expire</span>`
    : `<span class="meta">${c.days_left} days left in ${c.label}</span>`;
  $("#drawer").innerHTML = `
    <button class="close" onclick="closeDrawer()">×</button>
    <div class="meta">${esc(b.card)} · ${GROUP[b.period]} · ${b.tracking === "manual" ? "Manually tracked" : "Autotracked from statement credits"}</div>
    <h2 style="margin:4px 0 0">${esc(b.title)}</h2>
    <div class="box"><div style="display:flex;justify-content:space-between"><b>${c.label} <span class="meta">current</span></b>${note}</div>
      <div class="months">${months}</div>
      <div>Used ${money(c.used_minor)} of ${money(c.amount_minor)} · missed ${money(b.ytd.missed_minor)} this year</div>
      ${b.tracking === "manual" ? `<div class="meta" style="margin-top:6px">In-app credit, so it isn't on your statement. Click a month to mark it used.</div>` : ""}
    </div>
    <div class="box"><h3>Ask about this benefit</h3>
      <div class="chat-log" id="chat-log"></div>
      <div class="suggest">
        <button class="chip" onclick="ask('How can I use what is left before it resets?')">Use it before it resets</button>
        <button class="chip" onclick="ask('What counts and what does not count for this credit?')">What counts?</button>
        <button class="chip" onclick="ask('Is this worth using for me, given my history?')">Worth it for me?</button>
      </div>
      <form class="chat-form" onsubmit="event.preventDefault(); ask(this.q.value); this.q.value='';">
        <input name="q" placeholder="Ask anything about ${esc(b.title)}…" autocomplete="off"><button class="btn">Ask</button></form>
    </div>
    <div class="box" id="community"><h3>What the community does</h3><div class="meta">Loading…</div></div>
    <div class="box"><h3>Matched statement credits</h3>${credits}</div>
    <div class="box"><details><summary>Official terms</summary><div class="terms">${esc(b.terms || "No terms text in prepared data.")}</div></details></div>`;
  renderChat(id);
  loadCommunity(id);
}

async function loadCommunity(id) {
  const box = $("#community");
  try {
    const r = await fetch(`/api/benefits/${id}/community`);
    if (!r.ok) throw new Error((await r.json()).detail);
    const c = await r.json();
    if (openId !== id) return;
    box.innerHTML = `<h3>What the community does</h3>` + (c.tips.length
      ? `<div>${esc(c.blurb)}</div>` + c.tips.map((t) => `<div class="tip">• ${esc(t.tip)}<br>
          <a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_title || new URL(t.source_url).hostname)}</a>
          <span class="meta">${esc(t.source_date || "")}${t.last_verified ? " · verified " + esc(t.last_verified) : ""}</span></div>`).join("")
        + `<div class="meta" style="margin-top:6px">Community ideas, not official rules.</div>`
      : `<div class="meta">No community tips collected for this benefit yet.</div>`);
  } catch (e) { box.innerHTML = `<h3>What the community does</h3><div class="meta">${esc(e.message)}</div>`; }
}

function md(text) {
  let html = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = html.split("\n"), out = [];
  let list = false;
  for (const line of lines) {
    const m = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (m) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${m[1]}</li>`); }
    else { if (list) { out.push("</ul>"); list = false; } if (line.trim()) out.push(`<div>${line}</div>`); }
  }
  if (list) out.push("</ul>");
  return out.join("");
}

function renderChat(id) {
  const log = $("#chat-log");
  if (!log) return;
  log.innerHTML = (chats[id] ?? []).map((m) => `<div class="msg ${m.role}">${m.role === "user" ? esc(m.content) : md(m.content)}
    ${m.trace?.length ? `<div class="trace">tools: ${m.trace.map((t) => esc(t.tool)).join(" → ")}</div>` : ""}
    ${m.unverified?.length ? `<div class="warn">⚠ amounts not found in your data: ${esc(m.unverified.join(", "))}</div>` : ""}</div>`).join("");
  log.scrollTop = log.scrollHeight;
}

async function ask(question) {
  const id = openId;
  if (!question?.trim() || !id) return;
  const history = (chats[id] ??= []);
  history.push({role: "user", content: question});
  history.push({role: "assistant", content: "_Thinking…_"});
  renderChat(id);
  try {
    const r = await fetch(`/api/benefits/${id}/chat`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({messages: history.slice(0, -1).map(({role, content}) => ({role, content}))})});
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail);
    history[history.length - 1] = {role: "assistant", content: body.answer, trace: body.tool_trace, unverified: body.unverified_amounts};
  } catch (e) {
    history[history.length - 1] = {role: "assistant", content: "Error: " + e.message};
  }
  if (openId === id) renderChat(id);
}

async function toggleMark(id, start) {
  await fetch(`/api/benefits/${id}/mark`, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({period_start: start})});
  await load();
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
load();
</script>
</body>
</html>
